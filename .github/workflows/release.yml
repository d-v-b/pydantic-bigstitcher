name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@09d2acae674a48949e3602304ab46fd20ae0c42f # v6
        with:
          fetch-depth: 0 # hatch-vcs needs tags to compute the version
      - name: Set up Python
        uses: actions/setup-python@e797f83eb20b6d3a32e6acff2e6c9c8b76ec8c79 # v6
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Assert built version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="${TAG#v}"
          echo "Release tag: $TAG -> expected version: $expected"
          ls dist/
          for f in dist/*; do
            case "$(basename "$f")" in
              pydantic_bigstitcher-"$expected"-*|pydantic_bigstitcher-"$expected".tar.gz) ;;
              *) echo "ERROR: $f does not match version $expected (dirty/untagged build?)"; exit 1 ;;
            esac
          done
      - name: Upload distributions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Attach artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"

  docs:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@09d2acae674a48949e3602304ab46fd20ae0c42f # v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@e797f83eb20b6d3a32e6acff2e6c9c8b76ec8c79 # v6
        with:
          python-version: "3.12"
      - name: Deploy docs
        run: |
          python -m pip install --upgrade pip hatch
          hatch run docs:deploy --force
